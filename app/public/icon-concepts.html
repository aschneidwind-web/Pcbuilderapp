<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0b0b0e; display: flex; gap: 40px; padding: 60px; align-items: flex-start; flex-wrap: wrap; font-family: -apple-system, sans-serif; }
  .concept { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .label { color: #AEAEB2; font-size: 13px; font-weight: 500; }
  .sizes { display: flex; gap: 12px; align-items: flex-end; }
</style>
</head>
<body>

<!-- CONCEPT A: Rising Bars / Benchmark -->
<div class="concept">
  <div class="sizes">
    <!-- 512px -->
    <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#0b0b0e"/>
      <rect width="160" height="160" rx="36" fill="url(#bgA)"/>
      <rect x="28" y="96" width="20" height="40" rx="5" fill="#1A4FA0"/>
      <rect x="56" y="72" width="20" height="64" rx="5" fill="#1D6FD8"/>
      <rect x="84" y="48" width="20" height="88" rx="5" fill="#2389FF"/>
      <rect x="112" y="24" width="20" height="112" rx="5" fill="url(#barA)"/>
      <rect x="28" y="140" width="104" height="3" rx="1.5" fill="#1A3A6B"/>
      <defs>
        <linearGradient id="bgA" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
          <stop stop-color="#0D1F3C"/>
          <stop offset="1" stop-color="#0b0b0e"/>
        </linearGradient>
        <linearGradient id="barA" x1="122" y1="24" x2="122" y2="136" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5AC8FA"/>
          <stop offset="1" stop-color="#0A84FF"/>
        </linearGradient>
      </defs>
    </svg>
    <!-- 64px -->
    <svg width="64" height="64" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#0D1F3C"/>
      <rect x="28" y="96" width="20" height="40" rx="5" fill="#1A4FA0"/>
      <rect x="56" y="72" width="20" height="64" rx="5" fill="#1D6FD8"/>
      <rect x="84" y="48" width="20" height="88" rx="5" fill="#2389FF"/>
      <rect x="112" y="24" width="20" height="112" rx="5" fill="#5AC8FA"/>
      <rect x="28" y="140" width="104" height="3" rx="1.5" fill="#1A3A6B"/>
    </svg>
    <!-- 32px -->
    <svg width="32" height="32" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#0D1F3C"/>
      <rect x="28" y="96" width="20" height="40" rx="5" fill="#1A4FA0"/>
      <rect x="56" y="72" width="20" height="64" rx="5" fill="#1D6FD8"/>
      <rect x="84" y="48" width="20" height="88" rx="5" fill="#2389FF"/>
      <rect x="112" y="24" width="20" height="112" rx="5" fill="#5AC8FA"/>
      <rect x="28" y="140" width="104" height="3" rx="1.5" fill="#1A3A6B"/>
    </svg>
  </div>
  <div class="label">A — Rising Benchmark</div>
</div>

<!-- CONCEPT B: CPU Chip with S -->
<div class="concept">
  <div class="sizes">
    <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="url(#bgB)"/>
      <!-- chip body -->
      <rect x="44" y="44" width="72" height="72" rx="10" fill="#1C1C1E" stroke="#2A5DB0" stroke-width="2.5"/>
      <!-- pins left -->
      <rect x="28" y="60" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="28" y="77" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="28" y="94" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <!-- pins right -->
      <rect x="116" y="60" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="116" y="77" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="116" y="94" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <!-- pins top -->
      <rect x="60" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="77" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="94" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <!-- pins bottom -->
      <rect x="60" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="77" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="94" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <!-- S letterform -->
      <path d="M91 68c0-5-4-9-11-9s-11 4-11 9c0 4.5 3 7 9 9l4 1.5c5 1.8 8 4.5 8 9.5 0 5.5-4.5 10-12 10s-12-4-12-10" stroke="url(#sgrad)" stroke-width="7" stroke-linecap="round"/>
      <defs>
        <linearGradient id="bgB" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
          <stop stop-color="#0A1628"/>
          <stop offset="1" stop-color="#0b0b0e"/>
        </linearGradient>
        <linearGradient id="sgrad" x1="80" y1="59" x2="80" y2="107" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5AC8FA"/>
          <stop offset="1" stop-color="#0A84FF"/>
        </linearGradient>
      </defs>
    </svg>
    <svg width="64" height="64" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#0A1628"/>
      <rect x="44" y="44" width="72" height="72" rx="10" fill="#1C1C1E" stroke="#2A5DB0" stroke-width="2.5"/>
      <rect x="28" y="60" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="28" y="77" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="28" y="94" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="116" y="60" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="116" y="77" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="116" y="94" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="60" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="77" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="94" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="60" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="77" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="94" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <path d="M91 68c0-5-4-9-11-9s-11 4-11 9c0 4.5 3 7 9 9l4 1.5c5 1.8 8 4.5 8 9.5 0 5.5-4.5 10-12 10s-12-4-12-10" stroke="#0A84FF" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <svg width="32" height="32" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#0A1628"/>
      <rect x="44" y="44" width="72" height="72" rx="10" fill="#1C1C1E" stroke="#2A5DB0" stroke-width="2.5"/>
      <rect x="28" y="60" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="28" y="77" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="28" y="94" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="116" y="60" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="116" y="77" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="116" y="94" width="16" height="6" rx="3" fill="#2A5DB0"/>
      <rect x="60" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="77" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="94" y="28" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="60" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="77" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <rect x="94" y="116" width="6" height="16" rx="3" fill="#2A5DB0"/>
      <path d="M91 68c0-5-4-9-11-9s-11 4-11 9c0 4.5 3 7 9 9l4 1.5c5 1.8 8 4.5 8 9.5 0 5.5-4.5 10-12 10s-12-4-12-10" stroke="#0A84FF" stroke-width="7" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="label">B — CPU + S</div>
</div>

<!-- CONCEPT C: Lightning bolt through chip (speed/performance) -->
<div class="concept">
  <div class="sizes">
    <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="url(#bgC)"/>
      <!-- glow -->
      <ellipse cx="80" cy="80" rx="44" ry="44" fill="#0A84FF" fill-opacity="0.12"/>
      <!-- bolt -->
      <path d="M88 24L52 84h32L72 136l52-72H92L88 24z" fill="url(#boltC)"/>
      <defs>
        <linearGradient id="bgC" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
          <stop stop-color="#0D1117"/>
          <stop offset="1" stop-color="#0b0b0e"/>
        </linearGradient>
        <linearGradient id="boltC" x1="80" y1="24" x2="80" y2="136" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5AC8FA"/>
          <stop offset="0.5" stop-color="#0A84FF"/>
          <stop offset="1" stop-color="#6B3FD4"/>
        </linearGradient>
      </defs>
    </svg>
    <svg width="64" height="64" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#0D1117"/>
      <ellipse cx="80" cy="80" rx="44" ry="44" fill="#0A84FF" fill-opacity="0.12"/>
      <path d="M88 24L52 84h32L72 136l52-72H92L88 24z" fill="url(#boltC2)"/>
      <defs>
        <linearGradient id="boltC2" x1="80" y1="24" x2="80" y2="136" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5AC8FA"/>
          <stop offset="0.5" stop-color="#0A84FF"/>
          <stop offset="1" stop-color="#6B3FD4"/>
        </linearGradient>
      </defs>
    </svg>
    <svg width="32" height="32" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#0D1117"/>
      <ellipse cx="80" cy="80" rx="44" ry="44" fill="#0A84FF" fill-opacity="0.12"/>
      <path d="M88 24L52 84h32L72 136l52-72H92L88 24z" fill="#0A84FF"/>
    </svg>
  </div>
  <div class="label">C — Performance Bolt</div>
</div>

<!-- CONCEPT D: Stacked layers (build stack) -->
<div class="concept">
  <div class="sizes">
    <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="url(#bgD)"/>
      <!-- layer 3 (bottom) -->
      <rect x="30" y="102" width="100" height="18" rx="6" fill="#0A3060"/>
      <rect x="30" y="102" width="100" height="18" rx="6" stroke="#1A5AB0" stroke-width="1.5"/>
      <!-- layer 2 -->
      <rect x="24" y="78" width="112" height="18" rx="6" fill="#0D4080"/>
      <rect x="24" y="78" width="112" height="18" rx="6" stroke="#2070D0" stroke-width="1.5"/>
      <!-- layer 1 (top) -->
      <rect x="18" y="54" width="124" height="18" rx="6" fill="url(#topD)"/>
      <rect x="18" y="54" width="124" height="18" rx="6" stroke="#5AC8FA" stroke-width="1.5"/>
      <!-- detail lines on top layer -->
      <line x1="36" y1="63" x2="56" y2="63" stroke="#5AC8FA" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="64" y1="63" x2="72" y2="63" stroke="#5AC8FA" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="114" cy="63" r="4" fill="#5AC8FA"/>
      <circle cx="128" cy="63" r="4" fill="#1A5AB0"/>
      <defs>
        <linearGradient id="bgD" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
          <stop stop-color="#060D1A"/>
          <stop offset="1" stop-color="#0b0b0e"/>
        </linearGradient>
        <linearGradient id="topD" x1="18" y1="54" x2="142" y2="72" gradientUnits="userSpaceOnUse">
          <stop stop-color="#0A2A5C"/>
          <stop offset="1" stop-color="#0D3D80"/>
        </linearGradient>
      </defs>
    </svg>
    <svg width="64" height="64" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#060D1A"/>
      <rect x="30" y="102" width="100" height="18" rx="6" fill="#0A3060" stroke="#1A5AB0" stroke-width="1.5"/>
      <rect x="24" y="78" width="112" height="18" rx="6" fill="#0D4080" stroke="#2070D0" stroke-width="1.5"/>
      <rect x="18" y="54" width="124" height="18" rx="6" fill="#0A2A5C" stroke="#5AC8FA" stroke-width="1.5"/>
      <line x1="36" y1="63" x2="56" y2="63" stroke="#5AC8FA" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="114" cy="63" r="4" fill="#5AC8FA"/>
    </svg>
    <svg width="32" height="32" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="160" height="160" rx="36" fill="#060D1A"/>
      <rect x="30" y="102" width="100" height="18" rx="6" fill="#0A3060" stroke="#1A5AB0" stroke-width="1.5"/>
      <rect x="24" y="78" width="112" height="18" rx="6" fill="#0D4080" stroke="#2070D0" stroke-width="1.5"/>
      <rect x="18" y="54" width="124" height="18" rx="6" fill="#0A2A5C" stroke="#5AC8FA" stroke-width="1.5"/>
    </svg>
  </div>
  <div class="label">D — Build Stack</div>
</div>

</body>
</html>
